---
- name: Verify
  hosts: all
  tasks:
    - name: Gather service facts
      ansible.builtin.service_facts:

    - name: Check the collectd service is enabled and running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['collectd.service'].status == 'enabled'
          - ansible_facts.services['collectd.service'].state == 'running'
