---
- name: Stop collectd
  become: true
  become_user: "root"
  ansible.builtin.service:
    name: collectd
    state: stopped

- name: Start collectd
  become: true
  become_user: "root"
  ansible.builtin.service:
    name: collectd
    state: started

- name: Restart collectd
  become: true
  become_user: "root"
  ansible.builtin.service:
    name: collectd
    state: restarted
